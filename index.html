<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🪈 專業直笛智能練習器</title>
  <!-- 載入 OpenSheetMusicDisplay 樂譜渲染庫 -->
  <script src="https://cdn.jsdelivr.net/npm/opensheetmusicdisplay@1.8.8/build/opensheetmusicdisplay.min.js"></script>
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      margin: 0;
      padding: 16px;
      background-color: #0b132b;
      color: #f8fafc;
      text-align: center;
    }
    .container {
      max-width: 980px;
      margin: 0 auto;
      background: #1c2541;
      padding: 20px;
      border-radius: 16px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    }
    h1 { margin: 0 0 14px 0; font-size: 24px; color: #48cae4; }

    /* 設定控制列 */
    .settings-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(210px, 1fr));
      gap: 10px;
      background: #0b132b;
      padding: 14px;
      border-radius: 12px;
      margin-bottom: 16px;
      border: 1px solid #3a506b;
      text-align: left;
    }
    .setting-item { display: flex; flex-direction: column; gap: 4px; }
    .setting-item label { font-size: 12px; color: #94a3b8; font-weight: 600; }
    .select-box, .input-box {
      padding: 8px 10px;
      font-size: 13px;
      border-radius: 6px;
      border: 1px solid #475569;
      background: #1c2541;
      color: #f8fafc;
      outline: none;
    }

    /* 節拍器與主控制列 */
    .metro-toolbar {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: center;
      gap: 12px;
      background: #111d4a;
      padding: 12px;
      border-radius: 12px;
      margin-bottom: 16px;
      border: 1px solid #3a506b;
    }
    .metro-control {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 14px;
      color: #cbd5e1;
    }
    .slider {
      width: 110px;
      accent-color: #48cae4;
    }
    .btn {
      background: #0077b6;
      color: white;
      border: none;
      padding: 10px 20px;
      font-size: 14px;
      font-weight: 600;
      border-radius: 8px;
      cursor: pointer;
      transition: background 0.2s, transform 0.05s;
    }
    .btn:hover { background: #023e8a; }
    .btn-danger { background: #ef4444; }
    .btn-danger:hover { background: #dc2626; }
    .btn:disabled { background: #475569; cursor: not-allowed; }

    /* 狀態面板 */
    .status-panel {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
      gap: 10px;
      background: #0b132b;
      padding: 12px;
      border-radius: 12px;
      margin-bottom: 14px;
      border: 1px solid #3a506b;
    }
    .status-item { font-size: 12px; color: #94a3b8; }
    .status-value {
      font-size: 20px;
      font-weight: bold;
      margin-top: 4px;
    }
    #target-note { color: #48cae4; }
    #detected-note { color: #52b788; }
    .status-badge {
      font-size: 10px;
      padding: 2px 6px;
      border-radius: 4px;
      vertical-align: middle;
      margin-left: 4px;
    }
    .badge-ok { background: #065f46; color: #a7f3d0; }
    .badge-error { background: #7f1d1d; color: #fecaca; }
    .badge-held { background: #374151; color: #d1d5db; }

    /* 音分音準條 */
    .cent-bar-container {
      margin: 8px auto;
      max-width: 320px;
      background: #334155;
      height: 8px;
      border-radius: 4px;
      position: relative;
      overflow: hidden;
    }
    .cent-indicator {
      width: 12px;
      height: 100%;
      background: #52b788;
      position: absolute;
      left: 50%;
      transform: translateX(-50%);
      transition: left 0.05s ease-out;
      border-radius: 2px;
    }
    .cent-center-line {
      position: absolute;
      left: 50%;
      width: 2px;
      height: 100%;
      background: #ffffff;
      transform: translateX(-50%);
      opacity: 0.8;
    }

    /* 樂譜容器與高亮自訂樣式 */
    .sheet-wrapper {
      position: relative;
      background: #ffffff;
      border-radius: 10px;
      padding: 10px;
      margin-bottom: 16px;
      overflow-x: auto;
      transition: box-shadow 0.2s, border 0.2s;
    }
    .sheet-error-glow {
      box-shadow: 0 0 20px rgba(239, 68, 68, 0.8) !important;
      border: 2px solid #ef4444 !important;
    }
    #osmd-canvas { width: 100%; min-height: 220px; }

    /* 虛擬鍵盤 */
    .piano-section {
      padding-top: 14px;
      border-top: 1px dashed #3a506b;
    }
    .piano-title {
      font-size: 13px;
      color: #94a3b8;
      margin-bottom: 8px;
      font-weight: 600;
    }
    .keyboard-container {
      display: inline-flex;
      position: relative;
      background: #090d16;
      padding: 6px;
      border-radius: 8px;
      user-select: none;
      overflow-x: auto;
      max-width: 100%;
    }
    .key {
      display: inline-flex;
      align-items: flex-end;
      justify-content: center;
      padding-bottom: 6px;
      font-size: 10px;
      font-weight: bold;
      cursor: pointer;
      transition: background-color 0.1s;
    }
    .white-key {
      width: 36px;
      height: 125px;
      background: #ffffff;
      color: #1e293b;
      border: 1px solid #94a3b8;
      border-radius: 0 0 4px 4px;
      margin: 0 1px;
      z-index: 1;
    }
    .white-key:active { background: #cbd5e1; }
    .black-key {
      width: 22px;
      height: 75px;
      background: #1e293b;
      color: #94a3b8;
      border-radius: 0 0 3px 3px;
      margin-left: -12px;
      margin-right: -12px;
      z-index: 2;
    }
    .black-key:active { background: #475569; }
  </style>
</head>
<body>

<div class="container">
  <h1>🪈 專業直笛智能練習器</h1>

  <!-- 樂器種類與聲學設定 -->
  <div class="settings-grid">
    <div class="setting-item">
      <label>🎺 直笛種類與指法體系：</label>
      <select id="recorder-type-select" class="select-box">
        <option value="12" selected>高音直笛 (Soprano - C5，記譜高八度實音)</option>
        <option value="-5">中音直笛 (Alto - F4 笛 / 經典 F 指法)</option>
        <option value="0">次中音直笛 (Tenor - C4 笛 / 實音記譜)</option>
        <option value="-17">低音直笛 (Bass - F3 笛 / 低音 F 指法)</option>
      </select>
    </div>

    <div class="setting-item">
      <label>🎼 基準頻率 (A4 調音)：</label>
      <select id="a4-freq-select" class="select-box">
        <option value="440">A = 440 Hz (標準音)</option>
        <option value="442" selected>A = 442 Hz (歐陸管樂標準)</option>
        <option value="443">A = 443 Hz</option>
        <option value="444">A = 444 Hz</option>
      </select>
    </div>

    <div class="setting-item">
      <label>🎯 音準容許寬容度：</label>
      <select id="tolerance-select" class="select-box">
        <option value="40">嚴格 (±40 Cents)</option>
        <option value="55" selected>標準 (±55 Cents)</option>
        <option value="75">寬鬆 (±75 Cents)</option>
      </select>
    </div>
  </div>

  <!-- 節拍器與演奏控制列 -->
  <div class="metro-toolbar">
    <div class="metro-control">
      <label>📚 譜庫：</label>
      <select id="song-select" class="select-box" style="width: 160px;">
        <option value="twinkle">小星星 (C 大調)</option>
        <option value="ode_to_joy">歡樂頌 (示範)</option>
      </select>
    </div>

    <div class="metro-control">
      <label>⏱️ 速度 (BPM): <span id="bpm-display" style="font-weight:bold; color:#48cae4;">80</span></label>
      <input type="range" id="bpm-slider" class="slider" min="40" max="180" value="80">
    </div>

    <div class="metro-control">
      <label><input type="checkbox" id="metro-sound-toggle" checked> 🔊 節拍聲音</label>
    </div>

    <button id="start-btn" class="btn">🎤 啟動麥克風</button>
    <button id="play-rhythm-btn" class="btn" style="background:#059669;">▶️ 開始跟節奏演奏</button>
  </div>

  <!-- 狀態即時面板 -->
  <div class="status-panel">
    <div class="status-item">
      目標音符 (譜面實音)
      <div id="target-note" class="status-value">--</div>
    </div>
    <div class="status-item">
      吹奏判定
      <div class="status-value">
        <span id="detected-note">--</span>
        <span id="listening-state" class="status-badge badge-held">待機</span>
      </div>
    </div>
    <div class="status-item">
      偵測頻率 / 偏差
      <div id="detected-freq" class="status-value">0.0 Hz</div>
    </div>
    <div class="status-item">
      節奏狀態
      <div id="rhythm-status" class="status-value" style="font-size:16px; color:#38bdf8;">準備就緒</div>
    </div>
  </div>

  <!-- 音分偏差指針 -->
  <div class="cent-bar-container">
    <div class="cent-center-line"></div>
    <div id="cent-indicator" class="cent-indicator"></div>
  </div>
  <div style="font-size: 11px; color: #64748b; margin-bottom: 10px;">-50 Cent (偏低) ◄── 準確 ──► +50 Cent (偏高)</div>

  <!-- 樂譜渲染區域 -->
  <div id="sheet-wrapper" class="sheet-wrapper">
    <div id="osmd-canvas"></div>
  </div>

  <!-- 虛擬示範鋼琴 -->
  <div class="piano-section">
    <div class="piano-title">🎹 示範發聲鋼琴 (點擊即時試聽目標音準)</div>
    <div class="keyboard-container" id="piano-keyboard"></div>
  </div>
</div>

<script>
  // 譜庫
  const SCORE_LIBRARY = {
    twinkle: `<?xml version="1.0" encoding="UTF-8"?>
    <!DOCTYPE score-partwise PUBLIC "-//Recordare//DTD MusicXML 3.1 Partwise//EN" "http://www.musicxml.org/dtds/partwise.dtd">
    <score-partwise version="3.1">
      <part-list><score-part id="P1"><part-name>Recorder</part-name></score-part></part-list>
      <part id="P1">
        <measure number="1">
          <attributes><divisions>1</divisions><key><fifths>0</fifths></key><time><beats>4</beats><beat-type>4</beat-type></time><clef><sign>G</sign><line>2</line></clef></attributes>
          <note><pitch><step>C</step><octave>5</octave></pitch><duration>1</duration><type>quarter</type></note>
          <note><pitch><step>C</step><octave>5</octave></pitch><duration>1</duration><type>quarter</type></note>
          <note><pitch><step>G</step><octave>5</octave></pitch><duration>1</duration><type>quarter</type></note>
          <note><pitch><step>G</step><octave>5</octave></pitch><duration>1</duration><type>quarter</type></note>
        </measure>
        <measure number="2">
          <note><pitch><step>A</step><octave>5</octave></pitch><duration>1</duration><type>quarter</type></note>
          <note><pitch><step>A</step><octave>5</octave></pitch><duration>1</duration><type>quarter</type></note>
          <note><pitch><step>G</step><octave>5</octave></pitch><duration>2</duration><type>half</type></note>
        </measure>
        <measure number="3">
          <note><pitch><step>F</step><octave>5</octave></pitch><duration>1</duration><type>quarter</type></note>
          <note><pitch><step>F</step><octave>5</octave></pitch><duration>1</duration><type>quarter</type></note>
          <note><pitch><step>E</step><octave>5</octave></pitch><duration>1</duration><type>quarter</type></note>
          <note><pitch><step>E</step><octave>5</octave></pitch><duration>1</duration><type>quarter</type></note>
        </measure>
        <measure number="4">
          <note><pitch><step>D</step><octave>5</octave></pitch><duration>1</duration><type>quarter</type></note>
          <note><pitch><step>D</step><octave>5</octave></pitch><duration>1</duration><type>quarter</type></note>
          <note><pitch><step>C</step><octave>5</octave></pitch><duration>2</duration><type>half</type></note>
        </measure>
      </part>
    </score-partwise>`,

    ode_to_joy: `<?xml version="1.0" encoding="UTF-8"?>
    <!DOCTYPE score-partwise PUBLIC "-//Recordare//DTD MusicXML 3.1 Partwise//EN" "http://www.musicxml.org/dtds/partwise.dtd">
    <score-partwise version="3.1">
      <part-list><score-part id="P1"><part-name>Recorder</part-name></score-part></part-list>
      <part id="P1">
        <measure number="1">
          <attributes><divisions>1</divisions><key><fifths>0</fifths></key><time><beats>4</beats><beat-type>4</beat-type></time><clef><sign>G</sign><line>2</line></clef></attributes>
          <note><pitch><step>E</step><octave>5</octave></pitch><duration>1</duration><type>quarter</type></note>
          <note><pitch><step>E</step><octave>5</octave></pitch><duration>1</duration><type>quarter</type></note>
          <note><pitch><step>F</step><octave>5</octave></pitch><duration>1</duration><type>quarter</type></note>
          <note><pitch><step>G</step><octave>5</octave></pitch><duration>1</duration><type>quarter</type></note>
        </measure>
        <measure number="2">
          <note><pitch><step>G</step><octave>5</octave></pitch><duration>1</duration><type>quarter</type></note>
          <note><pitch><step>F</step><octave>5</octave></pitch><duration>1</duration><type>quarter</type></note>
          <note><pitch><step>E</step><octave>5</octave></pitch><duration>1</duration><type>quarter</type></note>
          <note><pitch><step>D</step><octave>5</octave></pitch><duration>1</duration><type>quarter</type></note>
        </measure>
        <measure number="3">
          <note><pitch><step>C</step><octave>5</octave></pitch><duration>1</duration><type>quarter</type></note>
          <note><pitch><step>C</step><octave>5</octave></pitch><duration>1</duration><type>quarter</type></note>
          <note><pitch><step>D</step><octave>5</octave></pitch><duration>1</duration><type>quarter</type></note>
          <note><pitch><step>E</step><octave>5</octave></pitch><duration>1</duration><type>quarter</type></note>
        </measure>
        <measure number="4">
          <note><pitch><step>E</step><octave>5</octave></pitch><duration>1.5</duration><type>quarter</type></note>
          <note><pitch><step>D</step><octave>5</octave></pitch><duration>0.5</duration><type>eighth</type></note>
          <note><pitch><step>D</step><octave>5</octave></pitch><duration>2</duration><type>half</type></note>
        </measure>
      </part>
    </score-partwise>`
  };

  const NOTE_NAMES = ["C", "C#", "D", "D#", "E", "F", "F#", "G", "G#", "A", "A#", "B"];
  let osmd, audioContext, analyser, dataArray;

  // 狀態與參數
  let currentTargetMidi = null;
  let a4Frequency = 442;
  let transposeOffset = 12; // 預設 Soprano (+12 半音)
  let centTolerance = 55;
  let bpm = 80;

  // 節奏線與節拍器變數
  let isRhythmRunning = false;
  let metroIntervalId = null;
  let isPitchMatched = false;
  let currentNoteDuration = 1; // 當前音符拍值 (預設 1 拍)
  let beatTimer = null;

  // 初始化樂譜
  async function loadScore(xmlString) {
    if (!osmd) {
      osmd = new opensheetmusicdisplay.OpenSheetMusicDisplay("osmd-canvas", {
        autoResize: true,
        drawTitle: true,
        followCursor: true
      });
    }
    await osmd.load(xmlString);
    osmd.render();
    resetCursor();
  }

  function resetCursor() {
    stopRhythm();
    osmd.cursor.reset();
    osmd.cursor.show();
    setCursorColor("#0077b6"); // 預設亮藍色
    updateCurrentTarget();
  }

  function setCursorColor(color) {
    const cursorElement = osmd.cursor.cursorElement;
    if (cursorElement) {
      cursorElement.style.backgroundColor = color;
      cursorElement.style.opacity = "0.6";
      cursorElement.style.zIndex = "10";
    }
  }

  function updateCurrentTarget() {
    if (osmd.cursor.iterator.EndReached) {
      document.getElementById('target-note').innerText = "🎉 演奏完成！";
      document.getElementById('rhythm-status').innerText = "完成！";
      currentTargetMidi = null;
      stopRhythm();
      return;
    }

    const voices = osmd.cursor.VoicesUnderCursor();
    if (voices && voices.length > 0) {
      const notes = voices[0].notes;
      if (notes && notes.length > 0 && !notes[0].isRest()) {
        const pitch = notes[0].Pitch;
        // 譜面音高加上直笛移調偏差
        currentTargetMidi = (pitch.halfTone + 12) + transposeOffset;
        currentNoteDuration = notes[0].Length.RealValue * 4; // 換算成拍數 (四分音符 = 1)
        const noteIdx = (currentTargetMidi % 12 + 12) % 12;
        const oct = Math.floor(currentTargetMidi / 12 - 1);
        document.getElementById('target-note').innerText = `${NOTE_NAMES[noteIdx]}${oct} (${currentNoteDuration}拍)`;
        return;
      }
    }
    currentTargetMidi = null;
    document.getElementById('target-note').innerText = "休止";
  }

  // 強化基頻辨識 (YIN-like + 拋物線插值)
  function detectPitchEnhanced(buffer, sampleRate) {
    const SIZE = buffer.length;
    let rms = 0;
    for (let i = 0; i < SIZE; i++) rms += buffer[i] * buffer[i];
    rms = Math.sqrt(rms / SIZE);
    if (rms < 0.02) return -1;

    const minPeriod = Math.floor(sampleRate / 2600);
    const maxPeriod = Math.floor(sampleRate / 240);

    const diff = new Float32Array(maxPeriod + 1);
    for (let tau = 0; tau <= maxPeriod; tau++) {
      let sum = 0;
      for (let i = 0; i < SIZE - maxPeriod; i++) {
        const delta = buffer[i] - buffer[i + tau];
        sum += delta * delta;
      }
      diff[tau] = sum;
    }

    const cmndf = new Float32Array(maxPeriod + 1);
    cmndf[0] = 1;
    let runningSum = 0;
    for (let tau = 1; tau <= maxPeriod; tau++) {
      runningSum += diff[tau];
      cmndf[tau] = runningSum > 0 ? (diff[tau] * tau) / runningSum : 1;
    }

    const threshold = 0.15;
    let tauEstimate = -1;
    for (let tau = minPeriod; tau <= maxPeriod; tau++) {
      if (cmndf[tau] < threshold) {
        while (tau + 1 <= maxPeriod && cmndf[tau + 1] < cmndf[tau]) tau++;
        tauEstimate = tau;
        break;
      }
    }

    if (tauEstimate === -1) {
      let minVal = 999;
      for (let tau = minPeriod; tau <= maxPeriod; tau++) {
        if (cmndf[tau] < minVal) { minVal = cmndf[tau]; tauEstimate = tau; }
      }
      if (minVal > 0.35) return -1;
    }

    if (tauEstimate > 0 && tauEstimate < maxPeriod) {
      const alpha = cmndf[tauEstimate - 1];
      const beta = cmndf[tauEstimate];
      const gamma = cmndf[tauEstimate + 1];
      const delta = (alpha - gamma) / (2 * (alpha - 2 * beta + gamma));
      return sampleRate / (tauEstimate + delta);
    }
    return sampleRate / tauEstimate;
  }

  // 循環音訊處理
  function processAudioLoop() {
    analyser.getFloatTimeDomainData(dataArray);
    const freq = detectPitchEnhanced(dataArray, audioContext.sampleRate);
    const stateBadge = document.getElementById('listening-state');
    const centIndicator = document.getElementById('cent-indicator');
    const sheetWrapper = document.getElementById('sheet-wrapper');

    if (freq > 0) {
      const midiFloat = 69 + 12 * Math.log2(freq / a4Frequency);
      const midiRounded = Math.round(midiFloat);
      const noteIdx = (midiRounded % 12 + 12) % 12;
      const octave = Math.floor(midiRounded / 12 - 1);
      const noteName = NOTE_NAMES[noteIdx] + octave;

      const centOffset = (midiFloat - midiRounded) * 100;
      const clampedCent = Math.max(-50, Math.min(50, centOffset));
      centIndicator.style.left = `${50 + clampedCent}%`;

      document.getElementById('detected-note').innerText = noteName;
      document.getElementById('detected-freq').innerText = `${freq.toFixed(1)} Hz (${centOffset > 0 ? '+' : ''}${Math.round(centOffset)}c)`;

      // 比對目標音高
      if (currentTargetMidi !== null) {
        const centDiff = Math.abs(midiFloat - currentTargetMidi) * 100;
        if (centDiff <= centTolerance) {
          // 音準正確：綠色標示
          isPitchMatched = true;
          setCursorColor("#10b981");
          sheetWrapper.classList.remove('sheet-error-glow');
          stateBadge.innerText = "音準正確";
          stateBadge.className = "status-badge badge-ok";
        } else {
          // 吹錯音或音準偏差：醒目紅色警示
          isPitchMatched = false;
          setCursorColor("#ef4444");
          sheetWrapper.classList.add('sheet-error-glow');
          stateBadge.innerText = "音高錯誤！";
          stateBadge.className = "status-badge badge-error";
        }
      }
    } else {
      isPitchMatched = false;
      sheetWrapper.classList.remove('sheet-error-glow');
      if (document.getElementById('detected-note').innerText !== "--") {
        stateBadge.innerText = "已鎖定";
        stateBadge.className = "status-badge badge-held";
      }
    }

    requestAnimationFrame(processAudioLoop);
  }

  // 節拍器滴答發聲 (Web Audio Synthesizer)
  function playClick(isHigh) {
    if (!document.getElementById('metro-sound-toggle').checked) return;
    const ctx = audioContext || new (window.AudioContext || window.webkitAudioContext)();
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();

    osc.type = "square";
    osc.frequency.setValueAtTime(isHigh ? 1200 : 800, ctx.currentTime);

    gain.gain.setValueAtTime(0.3, ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.05);

    osc.connect(gain);
    gain.connect(ctx.destination);
    osc.start();
    osc.stop(ctx.currentTime + 0.05);
  }

  // 節奏前進排程引擎 (智慧卡關邏輯)
  function scheduleNextNote() {
    if (!isRhythmRunning) return;

    // 計算當前音符所需時間 (毫秒)
    const msPerBeat = (60 / bpm) * 1000;
    const noteDurationMs = (currentNoteDuration || 1) * msPerBeat;

    beatTimer = setTimeout(() => {
      if (!isRhythmRunning) return;

      // 檢查是否音準正確；若吹錯或沒吹，節奏線停下來等待學生
      if (isPitchMatched || currentTargetMidi === null) {
        document.getElementById('rhythm-status').innerText = "🟢 節奏推進中";
        setCursorColor("#0077b6");
        osmd.cursor.next();
        updateCurrentTarget();
        scheduleNextNote();
      } else {
        document.getElementById('rhythm-status').innerText = "🛑 吹錯音停頓！請修正";
        setCursorColor("#ef4444");
        // 延遲 150ms 重新嘗試檢查
        setTimeout(scheduleNextNote, 150);
      }
    }, noteDurationMs);
  }

  // 啟動節奏演奏
  function startRhythm() {
    if (!audioContext) {
      alert("請先點擊「啟動麥克風」！");
      return;
    }
    isRhythmRunning = true;
    document.getElementById('play-rhythm-btn').innerText = "⏹️ 停止節奏演奏";
    document.getElementById('play-rhythm-btn').className = "btn btn-danger";
    document.getElementById('rhythm-status').innerText = "🟢 演奏中...";

    // 啟動音訊節拍器
    const msPerBeat = (60 / bpm) * 1000;
    let beatCount = 0;
    metroIntervalId = setInterval(() => {
      playClick(beatCount % 4 === 0);
      beatCount++;
    }, msPerBeat);

    scheduleNextNote();
  }

  function stopRhythm() {
    isRhythmRunning = false;
    if (metroIntervalId) clearInterval(metroIntervalId);
    if (beatTimer) clearTimeout(beatTimer);
    document.getElementById('play-rhythm-btn').innerText = "▶️ 開始跟節奏演奏";
    document.getElementById('play-rhythm-btn').className = "btn";
    document.getElementById('play-rhythm-btn').style.background = "#059669";
    document.getElementById('rhythm-status').innerText = "已停止";
    document.getElementById('sheet-wrapper').classList.remove('sheet-error-glow');
  }

  // 示範鋼琴鍵盤
  function playTone(midi) {
    const ctx = audioContext || new (window.AudioContext || window.webkitAudioContext)();
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();

    const freq = a4Frequency * Math.pow(2, (midi - 69) / 12);
    osc.type = "sine";
    osc.frequency.setValueAtTime(freq, ctx.currentTime);

    gain.gain.setValueAtTime(0.25, ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + 0.8);

    osc.connect(gain);
    gain.connect(ctx.destination);
    osc.start();
    osc.stop(ctx.currentTime + 0.8);
  }

  function buildPianoKeyboard() {
    const container = document.getElementById('piano-keyboard');
    container.innerHTML = '';
    const startMidi = 53; // F3 (涵蓋低音/中音/高音直笛)
    const endMidi = 77;   // F5

    for (let midi = startMidi; midi <= endMidi; midi++) {
      const noteIndex = midi % 12;
      const isBlack = [1, 3, 6, 8, 10].includes(noteIndex);
      const noteName = NOTE_NAMES[noteIndex] + Math.floor(midi / 12 - 1);

      const key = document.createElement('div');
      key.className = `key ${isBlack ? 'black-key' : 'white-key'}`;
      key.innerText = noteName;

      key.addEventListener('pointerdown', (e) => {
        e.preventDefault();
        playTone(midi);
      });

      container.appendChild(key);
    }
  }

  // 綁定事件
  document.getElementById('start-btn').addEventListener('click', async () => {
    try {
      audioContext = new (window.AudioContext || window.webkitAudioContext)();
      const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
      const source = audioContext.createMediaStreamSource(stream);

      analyser = audioContext.createAnalyser();
      analyser.fftSize = 2048;
      source.connect(analyser);
      dataArray = new Float32Array(analyser.fftSize);

      document.getElementById('start-btn').disabled = true;
      document.getElementById('start-btn').innerText = "🎧 麥克風監聽中";

      processAudioLoop();
    } catch (err) {
      alert("無法啟動麥克風，請確認瀏覽器權限設定！");
    }
  });

  document.getElementById('play-rhythm-btn').addEventListener('click', () => {
    if (isRhythmRunning) stopRhythm();
    else startRhythm();
  });

  document.getElementById('bpm-slider').addEventListener('input', (e) => {
    bpm = parseInt(e.target.value, 10);
    document.getElementById('bpm-display').innerText = bpm;
    if (isRhythmRunning) {
      // 動態更新速度
      stopRhythm();
      startRhythm();
    }
  });

  document.getElementById('recorder-type-select').addEventListener('change', (e) => {
    transposeOffset = parseInt(e.target.value, 10);
    updateCurrentTarget();
  });

  document.getElementById('a4-freq-select').addEventListener('change', (e) => {
    a4Frequency = parseFloat(e.target.value);
  });

  document.getElementById('tolerance-select').addEventListener('change', (e) => {
    centTolerance = parseInt(e.target.value, 10);
  });

  document.getElementById('song-select').addEventListener('change', (e) => {
    loadScore(SCORE_LIBRARY[e.target.value]);
  });

  window.addEventListener('load', () => {
    loadScore(SCORE_LIBRARY.twinkle);
    buildPianoKeyboard();
  });
</script>

</body>

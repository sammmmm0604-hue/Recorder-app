<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🪈 專業直笛智能練習器（含即時指法與節奏引擎）</title>
  <!-- 載入 OpenSheetMusicDisplay 樂譜渲染庫 -->
  <script src="https://cdn.jsdelivr.net/npm/opensheetmusicdisplay@1.8.8/build/opensheetmusicdisplay.min.js"></script>
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      margin: 0;
      padding: 16px;
      background-color: #0b132b;
      color: #f8fafc;
      text-align: center;
    }
    .container {
      max-width: 1050px;
      margin: 0 auto;
      background: #1c2541;
      padding: 20px;
      border-radius: 16px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    }
    h1 { margin: 0 0 14px 0; font-size: 24px; color: #48cae4; }

    /* 設定控制列 */
    .settings-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(210px, 1fr));
      gap: 10px;
      background: #0b132b;
      padding: 14px;
      border-radius: 12px;
      margin-bottom: 16px;
      border: 1px solid #3a506b;
      text-align: left;
    }
    .setting-item { display: flex; flex-direction: column; gap: 4px; }
    .setting-item label { font-size: 12px; color: #94a3b8; font-weight: 600; }
    .select-box {
      padding: 8px 10px;
      font-size: 13px;
      border-radius: 6px;
      border: 1px solid #475569;
      background: #1c2541;
      color: #f8fafc;
      outline: none;
    }

    /* 節拍器工具列 */
    .metro-toolbar {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: center;
      gap: 12px;
      background: #111d4a;
      padding: 12px;
      border-radius: 12px;
      margin-bottom: 16px;
      border: 1px solid #3a506b;
    }
    .metro-control {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 14px;
      color: #cbd5e1;
    }
    .slider { width: 110px; accent-color: #48cae4; }
    .btn {
      background: #0077b6;
      color: white;
      border: none;
      padding: 10px 20px;
      font-size: 14px;
      font-weight: 600;
      border-radius: 8px;
      cursor: pointer;
      transition: background 0.2s;
    }
    .btn:hover { background: #023e8a; }
    .btn-danger { background: #ef4444; }
    .btn-danger:hover { background: #dc2626; }
    .btn:disabled { background: #475569; cursor: not-allowed; }

    /* 狀態面板 */
    .status-panel {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
      gap: 10px;
      background: #0b132b;
      padding: 12px;
      border-radius: 12px;
      margin-bottom: 14px;
      border: 1px solid #3a506b;
    }
    .status-item { font-size: 12px; color: #94a3b8; }
    .status-value { font-size: 20px; font-weight: bold; margin-top: 4px; }
    #target-note { color: #48cae4; }
    #detected-note { color: #52b788; }
    .status-badge {
      font-size: 10px;
      padding: 2px 6px;
      border-radius: 4px;
      vertical-align: middle;
      margin-left: 4px;
    }
    .badge-ok { background: #065f46; color: #a7f3d0; }
    .badge-error { background: #7f1d1d; color: #fecaca; }
    .badge-held { background: #374151; color: #d1d5db; }

    /* 樂譜與指法主展示區 (雙欄佈局) */
    .main-workspace {
      display: flex;
      gap: 16px;
      align-items: stretch;
      margin-bottom: 16px;
    }
    .sheet-wrapper {
      flex: 1;
      position: relative;
      background: #ffffff;
      border-radius: 10px;
      padding: 10px;
      overflow-x: auto;
      transition: box-shadow 0.2s, border 0.2s;
    }
    .sheet-error-glow {
      box-shadow: 0 0 20px rgba(239, 68, 68, 0.8) !important;
      border: 2px solid #ef4444 !important;
    }
    #osmd-canvas { width: 100%; min-height: 220px; }

    /* 直笛指法面板 */
    .fingering-panel {
      width: 140px;
      background: #0b132b;
      border: 1px solid #3a506b;
      border-radius: 10px;
      padding: 12px 8px;
      display: flex;
      flex-direction: column;
      align-items: center;
      user-select: none;
    }
    .fingering-title {
      font-size: 12px;
      color: #38bdf8;
      font-weight: bold;
      margin-bottom: 6px;
    }
    .fingering-note-name {
      font-size: 16px;
      font-weight: bold;
      color: #f8fafc;
      margin-bottom: 8px;
    }
    .recorder-body {
      width: 44px;
      background: #334155;
      border-radius: 20px;
      padding: 8px 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      border: 2px solid #475569;
    }
    .hole-row {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 3px;
    }
    .hole {
      width: 16px;
      height: 16px;
      border-radius: 50%;
      border: 2px solid #94a3b8;
      background: #ffffff; /* 預設開啟 */
      transition: background-color 0.15s, border-color 0.15s;
    }
    .hole.closed { background: #0f172a; border-color: #38bdf8; } /* 閉孔 (黑) */
    .hole.half {
      background: linear-gradient(to right, #0f172a 50%, #ffffff 50%);
      border-color: #38bdf8;
    } /* 半孔 */
    .hole-thumb {
      width: 15px;
      height: 15px;
      border: 2px dashed #e2e8f0;
      margin-bottom: 4px;
    }
    .hole-small { width: 10px; height: 10px; }
    .hand-divider {
      width: 24px;
      height: 2px;
      background: #64748b;
      margin: 2px 0;
    }

    /* 音分音準條 */
    .cent-bar-container {
      margin: 8px auto;
      max-width: 320px;
      background: #334155;
      height: 8px;
      border-radius: 4px;
      position: relative;
      overflow: hidden;
    }
    .cent-indicator {
      width: 12px;
      height: 100%;
      background: #52b788;
      position: absolute;
      left: 50%;
      transform: translateX(-50%);
      transition: left 0.05s ease-out;
      border-radius: 2px;
    }
    .cent-center-line {
      position: absolute;
      left: 50%;
      width: 2px;
      height: 100%;
      background: #ffffff;
      transform: translateX(-50%);
      opacity: 0.8;
    }

    /* 虛擬鍵盤 */
    .piano-section { padding-top: 14px; border-top: 1px dashed #3a506b; }
    .piano-title { font-size: 13px; color: #94a3b8; margin-bottom: 8px; font-weight: 600; }
    .keyboard-container {
      display: inline-flex;
      position: relative;
      background: #090d16;
      padding: 6px;
      border-radius: 8px;
      user-select: none;
      overflow-x: auto;
      max-width: 100%;
    }
    .key {
      display: inline-flex;
      align-items: flex-end;
      justify-content: center;
      padding-bottom: 6px;
      font-size: 10px;
      font-weight: bold;
      cursor: pointer;
      transition: background-color 0.1s;
    }
    .white-key {
      width: 36px;
      height: 120px;
      background: #ffffff;
      color: #1e293b;
      border: 1px solid #94a3b8;
      border-radius: 0 0 4px 4px;
      margin: 0 1px;
      z-index: 1;
    }
    .white-key:active { background: #cbd5e1; }
    .black-key {
      width: 22px;
      height: 72px;
      background: #1e293b;
      color: #94a3b8;
      border-radius: 0 0 3px 3px;
      margin-left: -12px;
      margin-right: -12px;
      z-index: 2;
    }
    .black-key:active { background: #475569; }
  </style>
</head>
<body>

<div class="container">
  <h1>🪈 專業直笛智能練習器</h1>

  <!-- 設定面板 -->
  <div class="settings-grid">
    <div class="setting-item">
      <label>🎺 直笛種類與指法體系：</label>
      <select id="recorder-type-select" class="select-box">
        <option value="C_Soprano" selected>高音直笛 (Soprano / C 笛 - 記譜高八度實音)</option>
        <option value="F_Alto">中音直笛 (Alto / F 笛 - 標準 F 指法)</option>
        <option value="C_Tenor">次中音直笛 (Tenor / C 笛 - 實音記譜)</option>
        <option value="F_Bass">低音直笛 (Bass / F 笛 - 低音指法)</option>
      </select>
    </div>

    <div class="setting-item">
      <label>🎼 基準頻率 (A4 調音)：</label>
      <select id="a4-freq-select" class="select-box">
        <option value="440">A = 440 Hz (標準音)</option>
        <option value="442" selected>A = 442 Hz (管樂標準)</option>
        <option value="443">A = 443 Hz</option>
        <option value="444">A = 444 Hz</option>
      </select>
    </div>

    <div class="setting-item">
      <label>🎯 音準寬容度：</label>
      <select id="tolerance-select" class="select-box">
        <option value="40">嚴格 (±40 Cents)</option>
        <option value="55" selected>標準 (±55 Cents)</option>
        <option value="75">寬鬆 (±75 Cents)</option>
      </select>
    </div>
  </div>

  <!-- 節拍器與控制列 -->
  <div class="metro-toolbar">
    <div class="metro-control">
      <label>📚 譜庫：</label>
      <select id="song-select" class="select-box" style="width: 150px;">
        <option value="twinkle">小星星 (C 大調)</option>
        <option value="ode_to_joy">歡樂頌 (示範)</option>
      </select>
    </div>

    <div class="metro-control">
      <label>⏱️ 速度 (BPM): <span id="bpm-display" style="font-weight:bold; color:#48cae4;">80</span></label>
      <input type="range" id="bpm-slider" class="slider" min="40" max="160" value="80">
    </div>

    <div class="metro-control">
      <label><input type="checkbox" id="metro-sound-toggle" checked> 🔊 節拍聲音</label>
    </div>

    <button id="start-btn" class="btn">🎤 啟動麥克風</button>
    <button id="play-rhythm-btn" class="btn" style="background:#059669;">▶️ 開始跟節奏演奏</button>
  </div>

  <!-- 狀態面板 -->
  <div class="status-panel">
    <div class="status-item">
      目標音符
      <div id="target-note" class="status-value">--</div>
    </div>
    <div class="status-item">
      吹奏判定
      <div class="status-value">
        <span id="detected-note">--</span>
        <span id="listening-state" class="status-badge badge-held">待機</span>
      </div>
    </div>
    <div class="status-item">
      偵測頻率 / 偏差
      <div id="detected-freq" class="status-value">0.0 Hz</div>
    </div>
    <div class="status-item">
      節奏狀態
      <div id="rhythm-status" class="status-value" style="font-size:16px; color:#38bdf8;">準備就緒</div>
    </div>
  </div>

  <!-- 音分偏差指針 -->
  <div class="cent-bar-container">
    <div class="cent-center-line"></div>
    <div id="cent-indicator" class="cent-indicator"></div>
  </div>
  <div style="font-size: 11px; color: #64748b; margin-bottom: 10px;">-50 Cent (偏低) ◄── 準確 ──► +50 Cent (偏高)</div>

  <!-- 主工作區：樂譜 + 直笛指法面板 -->
  <div class="main-workspace">
    <!-- 樂譜 -->
    <div id="sheet-wrapper" class="sheet-wrapper">
      <div id="osmd-canvas"></div>
    </div>

    <!-- 直笛即時指法圖示 -->
    <div class="fingering-panel">
      <div class="fingering-title">指法圖示</div>
      <div id="fingering-name" class="fingering-note-name">--</div>
      <div class="recorder-body">
        <!-- 拇指孔 (背面) -->
        <div id="hole-0" class="hole hole-thumb" title="左手拇指孔 (背面)"></div>
        <div class="hand-divider"></div>
        <!-- 左手 1, 2, 3 -->
        <div id="hole-1" class="hole" title="左手食指 (孔1)"></div>
        <div id="hole-2" class="hole" title="左手中指 (孔2)"></div>
        <div id="hole-3" class="hole" title="左手無名指 (孔3)"></div>
        <div class="hand-divider"></div>
        <!-- 右手 4, 5, 6, 7 -->
        <div id="hole-4" class="hole" title="右手食指 (孔4)"></div>
        <div id="hole-5" class="hole" title="右手中指 (孔5)"></div>
        <div id="hole-6" class="hole" title="右手無名指 (孔6)"></div>
        <div id="hole-7" class="hole" title="右手小指 (孔7)"></div>
      </div>
      <div style="font-size: 10px; color: #64748b; margin-top: 6px;">●閉 ○開 ◐半</div>
    </div>
  </div>

  <!-- 示範鋼琴 -->
  <div class="piano-section">
    <div class="piano-title">🎹 示範鋼琴（以當前 A4 基準發聲）</div>
    <div class="keyboard-container" id="piano-keyboard"></div>
  </div>
</div>

<script>
  // 譜庫
  const SCORE_LIBRARY = {
    twinkle: `<?xml version="1.0" encoding="UTF-8"?>
    <!DOCTYPE score-partwise PUBLIC "-//Recordare//DTD MusicXML 3.1 Partwise//EN" "http://www.musicxml.org/dtds/partwise.dtd">
    <score-partwise version="3.1">
      <part-list><score-part id="P1"><part-name>Recorder</part-name></score-part></part-list>
      <part id="P1">
        <measure number="1">
          <attributes><divisions>1</divisions><key><fifths>0</fifths></key><time><beats>4</beats><beat-type>4</beat-type></time><clef><sign>G</sign><line>2</line></clef></attributes>
          <note><pitch><step>C</step><octave>5</octave></pitch><duration>1</duration><type>quarter</type></note>
          <note><pitch><step>C</step><octave>5</octave></pitch><duration>1</duration><type>quarter</type></note>
          <note><pitch><step>G</step><octave>5</octave></pitch><duration>1</duration><type>quarter</type></note>
          <note><pitch><step>G</step><octave>5</octave></pitch><duration>1</duration><type>quarter</type></note>
        </measure>
        <measure number="2">
          <note><pitch><step>A</step><octave>5</octave></pitch><duration>1</duration><type>quarter</type></note>
          <note><pitch><step>A</step><octave>5</octave></pitch><duration>1</duration><type>quarter</type></note>
          <note><pitch><step>G</step><octave>5</octave></pitch><duration>2</duration><type>half</type></note>
        </measure>
        <measure number="3">
          <note><pitch><step>F</step><octave>5</octave></pitch><duration>1</duration><type>quarter</type></note>
          <note><pitch><step>F</step><octave>5</octave></pitch><duration>1</duration><type>quarter</type></note>
          <note><pitch><step>E</step><octave>5</octave></pitch><duration>1</duration><type>quarter</type></note>
          <note><pitch><step>E</step><octave>5</octave></pitch><duration>1</duration><type>quarter</type></note>
        </measure>
        <measure number="4">
          <note><pitch><step>D</step><octave>5</octave></pitch><duration>1</duration><type>quarter</type></note>
          <note><pitch><step>D</step><octave>5</octave></pitch><duration>1</duration><type>quarter</type></note>
          <note><pitch><step>C</step><octave>5</octave></pitch><duration>2</duration><type>half</type></note>
        </measure>
      </part>
    </score-partwise>`,

    ode_to_joy: `<?xml version="1.0" encoding="UTF-8"?>
    <!DOCTYPE score-partwise PUBLIC "-//Recordare//DTD MusicXML 3.1 Partwise//EN" "http://www.musicxml.org/dtds/partwise.dtd">
    <score-partwise version="3.1">
      <part-list><score-part id="P1"><part-name>Recorder</part-name></score-part></part-list>
      <part id="P1">
        <measure number="1">
          <attributes><divisions>1</divisions><key><fifths>0</fifths></key><time><beats>4</beats><beat-type>4</beat-type></time><clef><sign>G</sign><line>2</line></clef></attributes>
          <note><pitch><step>E</step><octave>5</octave></pitch><duration>1</duration><type>quarter</type></note>
          <note><pitch><step>E</step><octave>5</octave></pitch><duration>1</duration><type>quarter</type></note>
          <note><pitch><step>F</step><octave>5</octave></pitch><duration>1</duration><type>quarter</type></note>
          <note><pitch><step>G</step><octave>5</octave></pitch><duration>1</duration><type>quarter</type></note>
        </measure>
        <measure number="2">
          <note><pitch><step>G</step><octave>5</octave></pitch><duration>1</duration><type>quarter</type></note>
          <note><pitch><step>F</step><octave>5</octave></pitch><duration>1</duration><type>quarter</type></note>
          <note><pitch><step>E</step><octave>5</octave></pitch><duration>1</duration><type>quarter</type></note>
          <note><pitch><step>D</step><octave>5</octave></pitch><duration>1</duration><type>quarter</type></note>
        </measure>
        <measure number="3">
          <note><pitch><step>C</step><octave>5</octave></pitch><duration>1</duration><type>quarter</type></note>
          <note><pitch><step>C</step><octave>5</octave></pitch><duration>1</duration><type>quarter</type></note>
          <note><pitch><step>D</step><octave>5</octave></pitch><duration>1</duration><type>quarter</type></note>
          <note><pitch><step>E</step><octave>5</octave></pitch><duration>1</duration><type>quarter</type></note>
        </measure>
        <measure number="4">
          <note><pitch><step>E</step><octave>5</octave></pitch><duration>1.5</duration><type>quarter</type></note>
          <note><pitch><step>D</step><octave>5</octave></pitch><duration>0.5</duration><type>eighth</type></note>
          <note><pitch><step>D</step><octave>5</octave></pitch><duration>2</duration><type>half</type></note>
        </measure>
      </part>
    </score-partwise>`
  };

  // 標準巴洛克直笛指法資料庫 [0=拇指, 1, 2, 3, 4, 5, 6, 7] (1=閉, 0=開, 0.5=半孔)
  const FINGERINGS_C = {
    "C4": [1, 1, 1, 1, 1, 1, 1, 1], "D4": [1, 1, 1, 1, 1, 1, 1, 0], "E4": [1, 1, 1, 1, 1, 1, 0, 0],
    "F4": [1, 1, 1, 1, 1, 0, 1, 1], "G4": [1, 1, 1, 1, 0, 0, 0, 0], "A4": [1, 1, 1, 0, 0, 0, 0, 0],
    "B4": [1, 1, 0, 0, 0, 0, 0, 0], "C5": [1, 1, 1, 1, 1, 1, 1, 1], "D5": [1, 1, 1, 1, 1, 1, 1, 0],
    "E5": [1, 1, 1, 1, 1, 1, 0, 0], "F5": [1, 1, 1, 1, 1, 0, 1, 1], "F#5": [1, 1, 1, 1, 0, 1, 1, 0],
    "G5": [1, 1, 1, 1, 0, 0, 0, 0], "A5": [1, 1, 1, 0, 0, 0, 0, 0], "B5": [1, 1, 0, 0, 0, 0, 0, 0],
    "C6": [1, 0, 1, 0, 0, 0, 0, 0], "D6": [0, 0, 1, 0, 0, 0, 0, 0], "E6": [0.5, 1, 1, 1, 1, 1, 0, 0],
    "F6": [0.5, 1, 1, 1, 1, 0, 1, 0], "G6": [0.5, 1, 1, 1, 0, 0, 0, 0]
  };

  const FINGERINGS_F = {
    "F4": [1, 1, 1, 1, 1, 1, 1, 1], "G4": [1, 1, 1, 1, 1, 1, 1, 0], "A4": [1, 1, 1, 1, 1, 1, 0, 0],
    "Bb4": [1, 1, 1, 1, 1, 0, 1, 1],"B4": [1, 1, 1, 1, 0, 1, 1, 0], "C5": [1, 1, 1, 1, 0, 0, 0, 0],
    "D5": [1, 1, 1, 0, 0, 0, 0, 0], "E5": [1, 1, 0, 0, 0, 0, 0, 0], "F5": [1, 0, 1, 0, 0, 0, 0, 0],
    "G5": [0, 0, 1, 0, 0, 0, 0, 0], "A5": [0.5, 1, 1, 1, 1, 1, 0, 0],"Bb5": [0.5, 1, 1, 1, 1, 0, 1, 0],
    "C6": [0.5, 1, 1, 1, 0, 0, 0, 0]
  };

  const NOTE_NAMES = ["C", "C#", "D", "D#", "E", "F", "F#", "G", "G#", "A", "A#", "B"];
  let osmd, audioContext, analyser, dataArray;

  // 狀態與參數
  let currentTargetMidi = null;
  let currentTargetNoteName = "";
  let a4Frequency = 442;
  let recorderType = "C_Soprano";
  let transposeOffset = 12; // 預設 Soprano
  let centTolerance = 55;
  let bpm = 80;

  // 節奏跟隨引擎核心變數
  let isRhythmRunning = false;
  let metroIntervalId = null;
  let currentNoteDuration = 1; // 拍數
  let noteStartTime = 0;
  let correctPitchFrames = 0;
  let totalPitchFrames = 0;
  let rhythmLoopId = null;

  // 更新直笛指法圖示
  function updateFingeringChart(noteName) {
    const nameEl = document.getElementById('fingering-name');
    nameEl.innerText = noteName || "--";
    if (!noteName) return;

    const isFType = recorderType.startsWith("F_");
    const dict = isFType ? FINGERINGS_F : FINGERINGS_C;
    const pattern = dict[noteName] || [0,0,0,0,0,0,0,0];

    for (let i = 0; i <= 7; i++) {
      const holeEl = document.getElementById(`hole-${i}`);
      holeEl.className = "hole" + (i === 0 ? " hole-thumb" : "");
      if (pattern[i] === 1) {
        holeEl.classList.add("closed");
      } else if (pattern[i] === 0.5) {
        holeEl.classList.add("half");
      }
    }
  }

  // 初始化樂譜
  async function loadScore(xmlString) {
    if (!osmd) {
      osmd = new opensheetmusicdisplay.OpenSheetMusicDisplay("osmd-canvas", {
        autoResize: true,
        drawTitle: true,
        followCursor: true
      });
    }
    await osmd.load(xmlString);
    osmd.render();
    resetCursor();
  }

  function resetCursor() {
    stopRhythm();
    osmd.cursor.reset();
    osmd.cursor.show();
    setCursorColor("#0077b6");
    updateCurrentTarget();
  }

  function setCursorColor(color) {
    const cursorElement = osmd.cursor.cursorElement;
    if (cursorElement) {
      cursorElement.style.backgroundColor = color;
      cursorElement.style.opacity = "0.55";
      cursorElement.style.zIndex = "10";
    }
  }

  function updateCurrentTarget() {
    if (osmd.cursor.iterator.EndReached) {
      document.getElementById('target-note').innerText = "🎉 演奏完成！";
      document.getElementById('rhythm-status').innerText = "完成！";
      currentTargetMidi = null;
      updateFingeringChart("");
      stopRhythm();
      return;
    }

    const voices = osmd.cursor.VoicesUnderCursor();
    if (voices && voices.length > 0) {
      const notes = voices[0].notes;
      if (notes && notes.length > 0 && !notes[0].isRest()) {
        const pitch = notes[0].Pitch;
        currentTargetMidi = (pitch.halfTone + 12) + transposeOffset;
        currentNoteDuration = notes[0].Length.RealValue * 4; // 四分音符 = 1拍

        const noteIdx = (currentTargetMidi % 12 + 12) % 12;
        const oct = Math.floor(currentTargetMidi / 12 - 1);
        currentTargetNoteName = `${NOTE_NAMES[noteIdx]}${oct}`;

        document.getElementById('target-note').innerText = `${currentTargetNoteName} (${currentNoteDuration}拍)`;
        updateFingeringChart(currentTargetNoteName);
        return;
      }
    }
    currentTargetMidi = null;
    document.getElementById('target-note').innerText = "休止";
    updateFingeringChart("");
  }

  // 強化版 YIN 音高偵測演算法
  function detectPitchEnhanced(buffer, sampleRate) {
    const SIZE = buffer.length;
    let rms = 0;
    for (let i = 0; i < SIZE; i++) rms += buffer[i] * buffer[i];
    rms = Math.sqrt(rms / SIZE);
    if (rms < 0.02) return -1;

    const minPeriod = Math.floor(sampleRate / 2600);
    const maxPeriod = Math.floor(sampleRate / 240);

    const diff = new Float32Array(maxPeriod + 1);
    for (let tau = 0; tau <= maxPeriod; tau++) {
      let sum = 0;
      for (let i = 0; i < SIZE - maxPeriod; i++) {
        const delta = buffer[i] - buffer[i + tau];
        sum += delta * delta;
      }
      diff[tau] = sum;
    }

    const cmndf = new Float32Array(maxPeriod + 1);
    cmndf[0] = 1;
    let runningSum = 0;
    for (let tau = 1; tau <= maxPeriod; tau++) {
      runningSum += diff[tau];
      cmndf[tau] = runningSum > 0 ? (diff[tau] * tau) / runningSum : 1;
    }

    const threshold = 0.15;
    let tauEstimate = -1;
    for (let tau = minPeriod; tau <= maxPeriod; tau++) {
      if (cmndf[tau] < threshold) {
        while (tau + 1 <= maxPeriod && cmndf[tau + 1] < cmndf[tau]) tau++;
        tauEstimate = tau;
        break;
      }
    }

    if (tauEstimate === -1) {
      let minVal = 999;
      for (let tau = minPeriod; tau <= maxPeriod; tau++) {
        if (cmndf[tau] < minVal) { minVal = cmndf[tau]; tauEstimate = tau; }
      }
      if (minVal > 0.35) return -1;
    }

    if (tauEstimate > 0 && tauEstimate < maxPeriod) {
      const alpha = cmndf[tauEstimate - 1];
      const beta = cmndf[tauEstimate];
      const gamma = cmndf[tauEstimate + 1];
      const delta = (alpha - gamma) / (2 * (alpha - 2 * beta + gamma));
      return sampleRate / (tauEstimate + delta);
    }
    return sampleRate / tauEstimate;
  }

  // 音訊主監聽循環
  function processAudioLoop() {
    analyser.getFloatTimeDomainData(dataArray);
    const freq = detectPitchEnhanced(dataArray, audioContext.sampleRate);
    const stateBadge = document.getElementById('listening-state');
    const centIndicator = document.getElementById('cent-indicator');
    const sheetWrapper = document.getElementById('sheet-wrapper');

    if (freq > 0) {
      const midiFloat = 69 + 12 * Math.log2(freq / a4Frequency);
      const midiRounded = Math.round(midiFloat);
      const noteIdx = (midiRounded % 12 + 12) % 12;
      const octave = Math.floor(midiRounded / 12 - 1);
      const noteName = NOTE_NAMES[noteIdx] + octave;

      const centOffset = (midiFloat - midiRounded) * 100;
      const clampedCent = Math.max(-50, Math.min(50, centOffset));
      centIndicator.style.left = `${50 + clampedCent}%`;

      document.getElementById('detected-note').innerText = noteName;
      document.getElementById('detected-freq').innerText = `${freq.toFixed(1)} Hz (${centOffset > 0 ? '+' : ''}${Math.round(centOffset)}c)`;

      // 比對目標音高（時窗累積正確訊框）
      if (currentTargetMidi !== null) {
        totalPitchFrames++;
        const centDiff = Math.abs(midiFloat - currentTargetMidi) * 100;
        if (centDiff <= centTolerance) {
          correctPitchFrames++;
          setCursorColor("#10b981");
          sheetWrapper.classList.remove('sheet-error-glow');
          stateBadge.innerText = "音準正確";
          stateBadge.className = "status-badge badge-ok";
        } else {
          setCursorColor("#ef4444");
          sheetWrapper.classList.add('sheet-error-glow');
          stateBadge.innerText = "音高偏離！";
          stateBadge.className = "status-badge badge-error";
        }
      }
    } else {
      sheetWrapper.classList.remove('sheet-error-glow');
      if (document.getElementById('detected-note').innerText !== "--") {
        stateBadge.innerText = "已鎖定";
        stateBadge.className = "status-badge badge-held";
      }
    }

    requestAnimationFrame(processAudioLoop);
  }

  // 節拍器滴答音效
  function playClick(isHigh) {
    if (!document.getElementById('metro-sound-toggle').checked) return;
    const ctx = audioContext || new (window.AudioContext || window.webkitAudioContext)();
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();

    osc.type = "sine";
    osc.frequency.setValueAtTime(isHigh ? 1400 : 900, ctx.currentTime);

    gain.gain.setValueAtTime(0.3, ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.04);

    osc.connect(gain);
    gain.connect(ctx.destination);
    osc.start();
    osc.stop(ctx.currentTime + 0.04);
  }

  // 核心節奏推進跟隨循環（時窗累積判定機制）
  function runRhythmLoop() {
    if (!isRhythmRunning) return;

    const now = performance.now();
    const msPerBeat = (60 / bpm) * 1000;
    const noteDurationMs = (currentNoteDuration || 1) * msPerBeat;
    const elapsed = now - noteStartTime;

    if (elapsed >= noteDurationMs) {
      // 判定時窗結果：休止符 或 音準命中率達到 35% 以上即算過關
      const isPassed = (currentTargetMidi === null) || (totalPitchFrames > 3 && (correctPitchFrames / totalPitchFrames) >= 0.35);

      if (isPassed) {
        document.getElementById('rhythm-status').innerText = "🟢 跟隨拍點中";
        setCursorColor("#0077b6");
        osmd.cursor.next();
        updateCurrentTarget();
        // 重設下一個音的計時與統計
        noteStartTime = performance.now();
        correctPitchFrames = 0;
        totalPitchFrames = 0;
      } else {
        // 吹錯音或漏吹：停下來等待修正
        document.getElementById('rhythm-status').innerText = "🛑 音準未達標，請吹對以推進";
        setCursorColor("#ef4444");
        // 延後判定點，給學生修正時間
        noteStartTime = performance.now() - (noteDurationMs * 0.7);
      }
    }

    rhythmLoopId = requestAnimationFrame(runRhythmLoop);
  }

  // 啟動節奏演奏
  function startRhythm() {
    if (!audioContext) {
      alert("請先點擊「啟動麥克風」！");
      return;
    }
    isRhythmRunning = true;
    document.getElementById('play-rhythm-btn').innerText = "⏹️ 停止演奏";
    document.getElementById('play-rhythm-btn').className = "btn btn-danger";
    document.getElementById('rhythm-status').innerText = "🟢 演奏開始！";

    // 啟動節拍器聲音
    const msPerBeat = (60 / bpm) * 1000;
    let beatCount = 0;
    playClick(true);
    metroIntervalId = setInterval(() => {
      beatCount++;
      playClick(beatCount % 4 === 0);
    }, msPerBeat);

    // 啟動樂譜推進引擎
    noteStartTime = performance.now();
    correctPitchFrames = 0;
    totalPitchFrames = 0;
    runRhythmLoop();
  }

  function stopRhythm() {
    isRhythmRunning = false;
    if (metroIntervalId) clearInterval(metroIntervalId);
    if (rhythmLoopId) cancelAnimationFrame(rhythmLoopId);
    document.getElementById('play-rhythm-btn').innerText = "▶️ 開始跟節奏演奏";
    document.getElementById('play-rhythm-btn').className = "btn";
    document.getElementById('play-rhythm-btn').style.background = "#059669";
    document.getElementById('rhythm-status').innerText = "已停止";
    document.getElementById('sheet-wrapper').classList.remove('sheet-error-glow');
  }

  // 鋼琴示範發聲
  function playTone(midi) {
    const ctx = audioContext || new (window.AudioContext || window.webkitAudioContext)();
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();

    const freq = a4Frequency * Math.pow(2, (midi - 69) / 12);
    osc.type = "sine";
    osc.frequency.setValueAtTime(freq, ctx.currentTime);

    gain.gain.setValueAtTime(0.25, ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + 0.8);

    osc.connect(gain);
    gain.connect(ctx.destination);
    osc.start();
    osc.stop(ctx.currentTime + 0.8);
  }

  function buildPianoKeyboard() {
    const container = document.getElementById('piano-keyboard');
    container.innerHTML = '';
    const startMidi = 53; // F3
    const endMidi = 77;   // F5

    for (let midi = startMidi; midi <= endMidi; midi++) {
      const noteIndex = midi % 12;
      const isBlack = [1, 3, 6, 8, 10].includes(noteIndex);
      const noteName = NOTE_NAMES[noteIndex] + Math.floor(midi / 12 - 1);

      const key = document.createElement('div');
      key.className = `key ${isBlack ? 'black-key' : 'white-key'}`;
      key.innerText = noteName;

      key.addEventListener('pointerdown', (e) => {
        e.preventDefault();
        playTone(midi);
      });

      container.appendChild(key);
    }
  }

  // 直笛種類切換更新
  function updateRecorderType(type) {
    recorderType = type;
    switch(type) {
      case "C_Soprano": transposeOffset = 12; break; // 記譜高八度實音
      case "F_Alto": transposeOffset = -5; break;    // F 指法
      case "C_Tenor": transposeOffset = 0; break;    // 實音記譜
      case "F_Bass": transposeOffset = -17; break;   // 低音 F 指法
    }
    updateCurrentTarget();
  }

  // 事件綁定
  document.getElementById('start-btn').addEventListener('click', async () => {
    try {
      audioContext = new (window.AudioContext || window.webkitAudioContext)();
      const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
      const source = audioContext.createMediaStreamSource(stream);

      analyser = audioContext.createAnalyser();
      analyser.fftSize = 2048;
      source.connect(analyser);
      dataArray = new Float32Array(analyser.fftSize);

      document.getElementById('start-btn').disabled = true;
      document.getElementById('start-btn').innerText = "🎧 麥克風監聽中";

      processAudioLoop();
    } catch (err) {
      alert("無法啟動麥克風，請檢查瀏覽器授權！");
    }
  });

  document.getElementById('play-rhythm-btn').addEventListener('click', () => {
    if (isRhythmRunning) stopRhythm();
    else startRhythm();
  });

  document.getElementById('bpm-slider').addEventListener('input', (e) => {
    bpm = parseInt(e.target.value, 10);
    document.getElementById('bpm-display').innerText = bpm;
    if (isRhythmRunning) {
      stopRhythm();
      startRhythm();
    }
  });

  document.getElementById('recorder-type-select').addEventListener('change', (e) => {
    updateRecorderType(e.target.value);
  });

  document.getElementById('a4-freq-select').addEventListener('change', (e) => {
    a4Frequency = parseFloat(e.target.value);
  });

  document.getElementById('tolerance-select').addEventListener('change', (e) => {
    centTolerance = parseInt(e.target.value, 10);
  });

  document.getElementById('song-select').addEventListener('change', (e) => {
    loadScore(SCORE_LIBRARY[e.target.value]);
  });

  window.addEventListener('load', () => {
    loadScore(SCORE_LIBRARY.twinkle);
    buildPianoKeyboard();
  });
</script>

</body>
</html>

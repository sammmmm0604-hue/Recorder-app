<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🪈 直笛即時樂譜跟隨練習器（專業校正版）</title>
  <!-- 載入 OpenSheetMusicDisplay 樂譜渲染庫 -->
  <script src="https://cdn.jsdelivr.net/npm/opensheetmusicdisplay@1.8.8/build/opensheetmusicdisplay.min.js"></script>
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      margin: 0;
      padding: 16px;
      background-color: #0f172a;
      color: #f8fafc;
      text-align: center;
    }
    .container {
      max-width: 950px;
      margin: 0 auto;
      background: #1e293b;
      padding: 20px;
      border-radius: 16px;
      box-shadow: 0 8px 30px rgba(0,0,0,0.4);
    }
    h1 { margin: 0 0 16px 0; font-size: 22px; color: #38bdf8; }

    /* 專業設定工具列 */
    .pro-settings {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 12px;
      background: #0f172a;
      padding: 12px;
      border-radius: 12px;
      margin-bottom: 16px;
      border: 1px solid #334155;
    }
    .setting-group {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 13px;
      color: #94a3b8;
    }
    .select-box, .input-box {
      padding: 6px 10px;
      font-size: 13px;
      border-radius: 6px;
      border: 1px solid #475569;
      background: #1e293b;
      color: #f8fafc;
      outline: none;
    }

    .toolbar {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 12px;
      margin-bottom: 16px;
    }
    .btn {
      background: #0284c7;
      color: white;
      border: none;
      padding: 10px 22px;
      font-size: 15px;
      font-weight: 600;
      border-radius: 8px;
      cursor: pointer;
      transition: background 0.2s;
    }
    .btn:hover { background: #0369a1; }
    .btn:disabled { background: #475569; cursor: not-allowed; }

    /* 狀態與指針面板 */
    .status-panel {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
      gap: 10px;
      background: #0f172a;
      padding: 12px;
      border-radius: 12px;
      margin-bottom: 16px;
      border: 1px solid #334155;
    }
    .status-item { font-size: 12px; color: #94a3b8; }
    .status-value {
      font-size: 20px;
      font-weight: bold;
      margin-top: 4px;
    }
    #target-note { color: #38bdf8; }
    #detected-note { color: #34d399; }
    .status-badge {
      font-size: 10px;
      padding: 2px 6px;
      border-radius: 4px;
      vertical-align: middle;
      margin-left: 4px;
    }
    .badge-listening { background: #065f46; color: #a7f3d0; }
    .badge-held { background: #7f1d1d; color: #fecaca; }

    /* 音分音準條 (Cent Gauge) */
    .cent-bar-container {
      margin: 10px auto;
      max-width: 320px;
      background: #334155;
      height: 10px;
      border-radius: 5px;
      position: relative;
      overflow: hidden;
    }
    .cent-indicator {
      width: 14px;
      height: 100%;
      background: #34d399;
      position: absolute;
      left: 50%;
      transform: translateX(-50%);
      transition: left 0.05s ease-out;
      border-radius: 3px;
    }
    .cent-center-line {
      position: absolute;
      left: 50%;
      width: 2px;
      height: 100%;
      background: #ffffff;
      transform: translateX(-50%);
      opacity: 0.7;
    }

    /* 樂譜容器 */
    #osmd-canvas {
      width: 100%;
      min-height: 220px;
      background: #ffffff;
      border-radius: 8px;
      padding: 10px;
      margin-bottom: 16px;
    }

    /* 虛擬鍵盤 */
    .piano-section {
      padding-top: 14px;
      border-top: 1px dashed #334155;
    }
    .piano-title {
      font-size: 13px;
      color: #94a3b8;
      margin-bottom: 8px;
      font-weight: 600;
    }
    .keyboard-container {
      display: inline-flex;
      position: relative;
      background: #090d16;
      padding: 6px;
      border-radius: 8px;
      user-select: none;
      overflow-x: auto;
      max-width: 100%;
    }
    .key {
      display: inline-flex;
      align-items: flex-end;
      justify-content: center;
      padding-bottom: 6px;
      font-size: 11px;
      font-weight: bold;
      cursor: pointer;
      transition: background-color 0.1s;
    }
    .white-key {
      width: 36px;
      height: 130px;
      background: #ffffff;
      color: #1e293b;
      border: 1px solid #94a3b8;
      border-radius: 0 0 4px 4px;
      margin: 0 1px;
      z-index: 1;
    }
    .white-key:active { background: #cbd5e1; }
    .black-key {
      width: 22px;
      height: 80px;
      background: #1e293b;
      color: #94a3b8;
      border-radius: 0 0 3px 3px;
      margin-left: -12px;
      margin-right: -12px;
      z-index: 2;
    }
    .black-key:active { background: #475569; }
  </style>
</head>
<body>

<div class="container">
  <h1>🪈 直笛即時樂譜跟隨練習器</h1>

  <!-- 專業聲學與校正設定 -->
  <div class="pro-settings">
    <div class="setting-group">
      <label>🎼 基準頻率 (A4):</label>
      <select id="a4-freq-select" class="select-box">
        <option value="440">A = 440 Hz (標準)</option>
        <option value="442" selected>A = 442 Hz (歐規管弦樂)</option>
        <option value="443">A = 443 Hz</option>
        <option value="444">A = 444 Hz</option>
      </select>
    </div>

    <div class="setting-group">
      <label>🎷 樂器調性 (移調):</label>
      <select id="transposition-select" class="select-box">
        <option value="0" selected>C 笛 (高音 Soprano / 次中音 Tenor)</option>
        <option value="-5">F 笛 (中音 Alto / 低音 Bass, -5半音)</option>
        <option value="7">F 笛 (上五度指法, +7半音)</option>
      </select>
    </div>

    <div class="setting-group">
      <label>🎯 音準寬容度:</label>
      <select id="tolerance-select" class="select-box">
        <option value="40">嚴格 (±40 Cents)</option>
        <option value="55" selected>標準 (±55 Cents)</option>
        <option value="70">寬鬆 (±70 Cents)</option>
      </select>
    </div>
  </div>

  <!-- 工具列 -->
  <div class="toolbar">
    <select id="song-select" class="select-box">
      <option value="twinkle">📚 譜庫：小星星 (C 大調)</option>
      <option value="ode_to_joy">📚 譜庫：歡樂頌 (簡短示範)</option>
    </select>
    <button id="start-btn" class="btn">🎤 啟動麥克風監聽</button>
  </div>

  <!-- 狀態面板 -->
  <div class="status-panel">
    <div class="status-item">
      目標音符
      <div id="target-note" class="status-value">--</div>
    </div>
    <div class="status-item">
      最後聽到的音
      <div class="status-value">
        <span id="detected-note">--</span>
        <span id="listening-state" class="status-badge badge-held">待機</span>
      </div>
    </div>
    <div class="status-item">
      偵測頻率 / 偏差
      <div id="detected-freq" class="status-value">0.0 Hz</div>
    </div>
  </div>

  <!-- 音分偏差指示器 -->
  <div class="cent-bar-container" title="音準偏差指針 (中央為準確)">
    <div class="cent-center-line"></div>
    <div id="cent-indicator" class="cent-indicator"></div>
  </div>
  <div style="font-size: 11px; color: #64748b; margin-bottom: 12px;">-50 Cent (偏低) ◄── 準確 ──► +50 Cent (偏高)</div>

  <!-- 樂譜渲染區域 -->
  <div id="osmd-canvas"></div>

  <!-- 示範聽音虛擬鍵盤 -->
  <div class="piano-section">
    <div class="piano-title">🎹 示範鋼琴（以當前 A4 頻率發聲）</div>
    <div class="keyboard-container" id="piano-keyboard"></div>
  </div>
</div>

<script>
  // 譜庫
  const SCORE_LIBRARY = {
    twinkle: `<?xml version="1.0" encoding="UTF-8"?>
    <!DOCTYPE score-partwise PUBLIC "-//Recordare//DTD MusicXML 3.1 Partwise//EN" "http://www.musicxml.org/dtds/partwise.dtd">
    <score-partwise version="3.1">
      <part-list><score-part id="P1"><part-name>Recorder</part-name></score-part></part-list>
      <part id="P1">
        <measure number="1">
          <attributes><divisions>1</divisions><key><fifths>0</fifths></key><time><beats>4</beats><beat-type>4</beat-type></time><clef><sign>G</sign><line>2</line></clef></attributes>
          <note><pitch><step>C</step><octave>5</octave></pitch><duration>1</duration><type>quarter</type></note>
          <note><pitch><step>C</step><octave>5</octave></pitch><duration>1</duration><type>quarter</type></note>
          <note><pitch><step>G</step><octave>5</octave></pitch><duration>1</duration><type>quarter</type></note>
          <note><pitch><step>G</step><octave>5</octave></pitch><duration>1</duration><type>quarter</type></note>
        </measure>
        <measure number="2">
          <note><pitch><step>A</step><octave>5</octave></pitch><duration>1</duration><type>quarter</type></note>
          <note><pitch><step>A</step><octave>5</octave></pitch><duration>1</duration><type>quarter</type></note>
          <note><pitch><step>G</step><octave>5</octave></pitch><duration>2</duration><type>half</type></note>
        </measure>
        <measure number="3">
          <note><pitch><step>F</step><octave>5</octave></pitch><duration>1</duration><type>quarter</type></note>
          <note><pitch><step>F</step><octave>5</octave></pitch><duration>1</duration><type>quarter</type></note>
          <note><pitch><step>E</step><octave>5</octave></pitch><duration>1</duration><type>quarter</type></note>
          <note><pitch><step>E</step><octave>5</octave></pitch><duration>1</duration><type>quarter</type></note>
        </measure>
        <measure number="4">
          <note><pitch><step>D</step><octave>5</octave></pitch><duration>1</duration><type>quarter</type></note>
          <note><pitch><step>D</step><octave>5</octave></pitch><duration>1</duration><type>quarter</type></note>
          <note><pitch><step>C</step><octave>5</octave></pitch><duration>2</duration><type>half</type></note>
        </measure>
      </part>
    </score-partwise>`,

    ode_to_joy: `<?xml version="1.0" encoding="UTF-8"?>
    <!DOCTYPE score-partwise PUBLIC "-//Recordare//DTD MusicXML 3.1 Partwise//EN" "http://www.musicxml.org/dtds/partwise.dtd">
    <score-partwise version="3.1">
      <part-list><score-part id="P1"><part-name>Recorder</part-name></score-part></part-list>
      <part id="P1">
        <measure number="1">
          <attributes><divisions>1</divisions><key><fifths>0</fifths></key><time><beats>4</beats><beat-type>4</beat-type></time><clef><sign>G</sign><line>2</line></clef></attributes>
          <note><pitch><step>E</step><octave>5</octave></pitch><duration>1</duration><type>quarter</type></note>
          <note><pitch><step>E</step><octave>5</octave></pitch><duration>1</duration><type>quarter</type></note>
          <note><pitch><step>F</step><octave>5</octave></pitch><duration>1</duration><type>quarter</type></note>
          <note><pitch><step>G</step><octave>5</octave></pitch><duration>1</duration><type>quarter</type></note>
        </measure>
        <measure number="2">
          <note><pitch><step>G</step><octave>5</octave></pitch><duration>1</duration><type>quarter</type></note>
          <note><pitch><step>F</step><octave>5</octave></pitch><duration>1</duration><type>quarter</type></note>
          <note><pitch><step>E</step><octave>5</octave></pitch><duration>1</duration><type>quarter</type></note>
          <note><pitch><step>D</step><octave>5</octave></pitch><duration>1</duration><type>quarter</type></note>
        </measure>
      </part>
    </score-partwise>`
  };

  const NOTE_NAMES = ["C", "C#", "D", "D#", "E", "F", "F#", "G", "G#", "A", "A#", "B"];
  let osmd, audioContext, analyser, dataArray;
  let currentTargetMidi = null;
  let hitFramesCount = 0;
  const REQUIRED_STABLE_FRAMES = 5;

  // 設定參數
  let a4Frequency = 442;
  let transposeOffset = 0;
  let centTolerance = 55;

  // 初始化樂譜
  async function loadScore(xmlString) {
    if (!osmd) {
      osmd = new opensheetmusicdisplay.OpenSheetMusicDisplay("osmd-canvas", {
        autoResize: true,
        drawTitle: true,
        followCursor: true
      });
    }
    await osmd.load(xmlString);
    osmd.render();
    osmd.cursor.show();
    updateCurrentTarget();
  }

  function updateCurrentTarget() {
    if (osmd.cursor.iterator.EndReached) {
      document.getElementById('target-note').innerText = "🎉 完成！";
      currentTargetMidi = null;
      return;
    }
    const voices = osmd.cursor.VoicesUnderCursor();
    if (voices && voices.length > 0) {
      const notes = voices[0].notes;
      if (notes && notes.length > 0 && !notes[0].isRest()) {
        const pitch = notes[0].Pitch;
        // 取得譜面音高並加上移調偏量
        currentTargetMidi = (pitch.halfTone + 12) + transposeOffset;
        const noteIdx = (currentTargetMidi % 12 + 12) % 12;
        const oct = Math.floor(currentTargetMidi / 12 - 1);
        document.getElementById('target-note').innerText = NOTE_NAMES[noteIdx] + oct;
        return;
      }
    }
    currentTargetMidi = null;
    document.getElementById('target-note').innerText = "休止";
  }

  // 強化版基頻偵測（Normalized Difference Function + 拋物線插值）
  function detectPitchEnhanced(buffer, sampleRate) {
    const SIZE = buffer.length;
    let rms = 0;
    for (let i = 0; i < SIZE; i++) rms += buffer[i] * buffer[i];
    rms = Math.sqrt(rms / SIZE);
    if (rms < 0.02) return -1; // 噪音過濾

    // 限制在直笛音域 (260 Hz ~ 2600 Hz)
    const minPeriod = Math.floor(sampleRate / 2600);
    const maxPeriod = Math.floor(sampleRate / 260);

    const diff = new Float32Array(maxPeriod + 1);
    for (let tau = 0; tau <= maxPeriod; tau++) {
      let sum = 0;
      for (let i = 0; i < SIZE - maxPeriod; i++) {
        const delta = buffer[i] - buffer[i + tau];
        sum += delta * delta;
      }
      diff[tau] = sum;
    }

    // 累計正規化差分
    const cmndf = new Float32Array(maxPeriod + 1);
    cmndf[0] = 1;
    let runningSum = 0;
    for (let tau = 1; tau <= maxPeriod; tau++) {
      runningSum += diff[tau];
      cmndf[tau] = runningSum > 0 ? (diff[tau] * tau) / runningSum : 1;
    }

    // 尋找第一個低於門檻的主峰
    const threshold = 0.15;
    let tauEstimate = -1;
    for (let tau = minPeriod; tau <= maxPeriod; tau++) {
      if (cmndf[tau] < threshold) {
        while (tau + 1 <= maxPeriod && cmndf[tau + 1] < cmndf[tau]) {
          tau++;
        }
        tauEstimate = tau;
        break;
      }
    }

    if (tauEstimate === -1) {
      // 找不到顯著峰值，退回找全局最小值
      let minVal = 999;
      for (let tau = minPeriod; tau <= maxPeriod; tau++) {
        if (cmndf[tau] < minVal) {
          minVal = cmndf[tau];
          tauEstimate = tau;
        }
      }
      if (minVal > 0.35) return -1; // 音訊不夠純淨
    }

    // 拋物線次取樣插值 (Parabolic Interpolation)
    if (tauEstimate > 0 && tauEstimate < maxPeriod) {
      const alpha = cmndf[tauEstimate - 1];
      const beta = cmndf[tauEstimate];
      const gamma = cmndf[tauEstimate + 1];
      const delta = (alpha - gamma) / (2 * (alpha - 2 * beta + gamma));
      return sampleRate / (tauEstimate + delta);
    }

    return sampleRate / tauEstimate;
  }

  // 循環音訊處理
  function processAudioLoop() {
    analyser.getFloatTimeDomainData(dataArray);
    const freq = detectPitchEnhanced(dataArray, audioContext.sampleRate);
    const stateBadge = document.getElementById('listening-state');
    const centIndicator = document.getElementById('cent-indicator');

    if (freq > 0) {
      // 依據 A4 基準計算精確的浮點 MIDI 編號
      const midiFloat = 69 + 12 * Math.log2(freq / a4Frequency);
      const midiRounded = Math.round(midiFloat);
      const noteIdx = (midiRounded % 12 + 12) % 12;
      const octave = Math.floor(midiRounded / 12 - 1);
      const noteName = NOTE_NAMES[noteIdx] + octave;

      // 音分偏差 (Cent Offset: -50 ~ +50)
      const centOffset = (midiFloat - midiRounded) * 100;
      const clampedCent = Math.max(-50, Math.min(50, centOffset));
      const centPercent = 50 + clampedCent; // 0% ~ 100%
      centIndicator.style.left = `${centPercent}%`;

      document.getElementById('detected-note').innerText = noteName;
      document.getElementById('detected-freq').innerText = `${freq.toFixed(1)} Hz (${centOffset > 0 ? '+' : ''}${Math.round(centOffset)}c)`;
      stateBadge.innerText = "演奏中";
      stateBadge.className = "status-badge badge-listening";

      // 樂譜對位比對
      if (currentTargetMidi !== null) {
        const midiDifferenceCent = Math.abs(midiFloat - currentTargetMidi) * 100;
        if (midiDifferenceCent <= centTolerance) {
          hitFramesCount++;
          if (hitFramesCount >= REQUIRED_STABLE_FRAMES) {
            osmd.cursor.next();
            updateCurrentTarget();
            hitFramesCount = 0;
          }
        } else {
          hitFramesCount = Math.max(0, hitFramesCount - 1);
        }
      }
    } else {
      hitFramesCount = 0;
      if (document.getElementById('detected-note').innerText !== "--") {
        stateBadge.innerText = "已鎖定最後音";
        stateBadge.className = "status-badge badge-held";
      }
    }

    requestAnimationFrame(processAudioLoop);
  }

  // 示範發聲 (採用當前 A4 基準)
  function playTone(midi) {
    const ctx = audioContext || new (window.AudioContext || window.webkitAudioContext)();
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();

    const freq = a4Frequency * Math.pow(2, (midi - 69) / 12);
    osc.type = "sine";
    osc.frequency.setValueAtTime(freq, ctx.currentTime);

    gain.gain.setValueAtTime(0.25, ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + 0.9);

    osc.connect(gain);
    gain.connect(ctx.destination);
    osc.start();
    osc.stop(ctx.currentTime + 0.9);
  }

  // 建立鍵盤
  function buildPianoKeyboard() {
    const container = document.getElementById('piano-keyboard');
    container.innerHTML = '';
    const startMidi = 60; // C4
    const endMidi = 74;   // D6

    for (let midi = startMidi; midi <= endMidi; midi++) {
      const noteIndex = midi % 12;
      const isBlack = [1, 3, 6, 8, 10].includes(noteIndex);
      const noteName = NOTE_NAMES[noteIndex] + Math.floor(midi / 12 - 1);

      const key = document.createElement('div');
      key.className = `key ${isBlack ? 'black-key' : 'white-key'}`;
      key.innerText = noteName;

      key.addEventListener('pointerdown', (e) => {
        e.preventDefault();
        playTone(midi);
      });

      container.appendChild(key);
    }
  }

  // 事件綁定
  document.getElementById('start-btn').addEventListener('click', async () => {
    try {
      audioContext = new (window.AudioContext || window.webkitAudioContext)();
      const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
      const source = audioContext.createMediaStreamSource(stream);

      analyser = audioContext.createAnalyser();
      analyser.fftSize = 2048;
      source.connect(analyser);
      dataArray = new Float32Array(analyser.fftSize);

      document.getElementById('start-btn').disabled = true;
      document.getElementById('start-btn').innerText = "🎧 專業監聽中...";

      processAudioLoop();
    } catch (err) {
      alert("無法啟動麥克風，請檢查瀏覽器設定！");
    }
  });

  document.getElementById('a4-freq-select').addEventListener('change', (e) => {
    a4Frequency = parseFloat(e.target.value);
  });

  document.getElementById('transposition-select').addEventListener('change', (e) => {
    transposeOffset = parseInt(e.target.value, 10);
    updateCurrentTarget();
  });

  document.getElementById('tolerance-select').addEventListener('change', (e) => {
    centTolerance = parseInt(e.target.value, 10);
  });

  document.getElementById('song-select').addEventListener('change', (e) => {
    loadScore(SCORE_LIBRARY[e.target.value]);
  });

  window.addEventListener('load', () => {
    loadScore(SCORE_LIBRARY.twinkle);
    buildPianoKeyboard();
  });
</script>

</body>
</html>
